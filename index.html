<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100年後のトレジャーハント</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="map" class="background-map"></div>
    <div class="overlay"></div>
    
    <div class="container">
        <div class="countdown-wrapper">
            <div class="title">2127年1月9日まであと</div>
            <div class="timer">
                <span id="days">00</span>日
                <span id="hours">00</span>時間
                <span id="minutes">00</span>分
                <span id="seconds">00</span>秒
            </div>
        </div>
        
        <div class="current-date">2027年1月9日</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
