<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>treasure hunt</title>
    <link rel="icon" href="images/favicon.png">
    <!-- 地図用ライブラリのCSSを追加 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loading-screen">
        <div class="scanline"></div>
        <div class="loader-content">
            <div class="loader-text">ACCESSING MAP DATA...</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- 背景画像を地図(id="map")に変更 -->
    <div id="map" class="background-map"></div>
    <div class="overlay"></div>
    
    <div class="container">
        <div class="countdown-wrapper">
            <div class="title">2127/01/09まで...</div>
            <div class="timer">
                <span id="days">00</span>d:<br>
                <span id="hours">00</span>h
                <span id="minutes">00</span>m
                <span id="seconds">00</span>s
            </div>
        </div>
        
        <div class="current-date">2027/01/09<br>
                                    nagao ryohei<br>
                                    kouhira natsumi<br> 
                                    tateiwa daiya<br>
                                    nagata karin<br>
                                    nagamori eko<br>
                                    fukuzaki kurumi<br>
                                    furuya kohei<br>
                                    fuwa nozomi
        </div>
        <div class="created-date">created by toi
        </div>
    </div>

    <!-- 地図用ライブラリのJSを追加 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
