<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>treasure hunt</title>
    <link rel="icon" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loading-screen">
        <div class="scanline"></div>
        <div class="loader-content">
            <div class="loader-text">ACCESSING MAP DATA...</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <div class="background-map"></div>
    <div class="overlay"></div>
    
    <div class="container">
        <div class="countdown-wrapper">
            <div class="title">2127年1月9日まで</div>
            <div class="timer">
                <span id="days">00</span>日<br>
                <span id="hours">00</span>時間
                <span id="minutes">00</span>分
                <span id="seconds">00</span>秒
            </div>
        </div>
        
        <div class="current-date">2027.01.09<br>
                                    nagao ryohei<br>
                                    kouhira natumi<br> 
                                    tateiwa daiya<br>
                                    nagata karin<br>
                                    nagamori eko<br>
                                    fukuzaki kurumi<br>
                                    furuya kohei<br>
                                    fuwa nozomi
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
